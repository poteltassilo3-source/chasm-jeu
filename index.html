 ];

let DB=null,ISOWN=false,TOUR=1,RES=[],DBOK=false,DBSLOW=false;
const LKEY='chasm_tournoi_local';
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'{}');return{tour:o.tour||1,res:o.res||[]}}catch(e){return{tour:1,res:[]}}}

async function addResult(r){

function standings(){
 const maxT=Math.max(TOUR,...RES.map(r=>r.tour),1);
 const rows=TEAMS.map(t=>{const per=[];for(let k=1;k<=maxT;k++){const rs=RES.filter(r=>r.eq===t.id&&r.tour===k);per.push(rs.length?Math.max(...rs.map(r=>r.score)):null)}
  const total=per.reduce((a,b)=>a+(b||0),0),wins=RES.filter(r=>r.eq===t.id&&r.win).length,games=RES.filter(r=>r.eq===t.id).length;
  const prev=per.slice(0,-1).reduce((a,b)=>a+(b||0),0);
  return{t,per,total,prev,wins,games}});
 const rank=a=>a.slice().sort((x,y)=>y.total-x.total||y.wins-x.wins);
 const now=rank(rows),before=rank(rows.map(r=>({...r,total:r.prev})));
 now.forEach((r,i)=>{r.pos=i+1;r.prevPos=before.findIndex(b=>b.t.id===r.t.id)+1});
 return{rows:now,maxT};
}

   <button class="abtn g" onclick="manualAdd()">➕ Ajouter</button></div>
  <div class="sub" style="text-align:left;margin:4px 0">Derniers scores reçus :</div>
  ${last.length?last.map(r=>`<div class="arow small">${TG[r.eq].e} ${TG[r.eq].n} · tour ${r.tour} · <b>${fmt(r.score)}</b> pts ${r.win?'🏆':''}${r.man?' (saisi à la main)':''}<button class="x" onclick="delResult('${r.id}')">✕</button></div>`).join(''):'<div class="sub">Aucun score pour l’instant.</div>'}
  <div class="arow"><button class="abtn r" onclick="askReset()">🗑️ Réinitialiser le tournoi</button><span id="rst"></span></div></div>`;
}
async function manualAdd(){const eq=$('mEq').value,t=Number($('mT').value)||TOUR,sc=Math.round(Number($('mS').value));if(!(sc>=0)||$('mS').value===''){$('mS').style.borderColor='#e63946';return}
 try{await addResult({eq,tour:t,score:sc,seg:0,win:false,at:Date.now(),man:true})}catch(e){alertBox('Impossible d’enregistrer ce score ici.')}}
function askReset(){$('rst').innerHTML=`Tout effacer ? <button class="abtn r" onclick="doReset()">Oui, effacer</button> <button class="abtn" onclick="$('rst').innerHTML=''">Non</button>`}
async function doReset(){const ids=RES.map(r=>r.id);for(const id of ids){try{await delResult(id)}catch(e){}}await setTour(1)}
function alertBox(t){const r=$('rst');if(r)r.textContent=t}
home();
</script>
</body>
